name: Weekly Koikeya Allergen Sync

on:
  schedule:
    # Every Monday at 02:00 UTC (11:00 AM JST)
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install BeautifulSoup
        run: pip install beautifulsoup4

      - name: Scrape Data
        run: python update_data.py

      - name: Save and Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add koikeya_allergens.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Koikeya allergen data" && git push)
